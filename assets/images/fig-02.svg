<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">从价格变动到个人净收益</title><desc id="desc">资产涨幅8%，不等于全部现金的净收益率</desc><rect width="720" height="650" fill="#F6F5EF"/><g font-family="Noto Serif CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif"><text x="36" y="50" font-size="28" fill="#18333B" text-anchor="start">从价格变动到个人净收益</text><text x="36" y="84" font-size="18" fill="#526971" text-anchor="start">资产涨幅8%，不等于全部现金的净收益率</text><rect x="32" y="125" width="656" height="64" rx="12" fill="#FFFFFF"/><text x="50" y="151" font-size="19" fill="#526971" text-anchor="start">初始实际付出</text><text x="668" y="173" font-size="24" fill="#18333B" text-anchor="end">10000＋20＝10020元</text><rect x="32" y="202" width="656" height="64" rx="12" fill="#FFFFFF"/><text x="50" y="228" font-size="19" fill="#526971" text-anchor="start">资产出售所得</text><text x="668" y="250" font-size="24" fill="#187D85" text-anchor="end">10800元</text><rect x="32" y="279" width="656" height="64" rx="12" fill="#FFFFFF"/><text x="50" y="305" font-size="19" fill="#526971" text-anchor="start">持有期间现金分配</text><text x="668" y="327" font-size="24" fill="#187D85" text-anchor="end">＋300元</text><rect x="32" y="356" width="656" height="64" rx="12" fill="#FFFFFF"/><text x="50" y="382" font-size="19" fill="#526971" text-anchor="start">卖出费用</text><text x="668" y="404" font-size="24" fill="#B5544C" text-anchor="end">−20元</text><rect x="32" y="433" width="656" height="64" rx="12" fill="#FFFFFF"/><text x="50" y="459" font-size="19" fill="#526971" text-anchor="start">最终实际收回</text><text x="668" y="481" font-size="24" fill="#18333B" text-anchor="end">11080元</text><text x="36" y="555" font-size="24" fill="#187D85" text-anchor="start">净赚1060元；1060 ÷ 10020 ≈ 10.58%</text><text x="36" y="603" font-size="19" fill="#526971" text-anchor="start">持有一年；分配不再投资；忽略税收</text></g></svg>