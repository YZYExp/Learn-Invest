<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="title"><title id="title">让决策可以被复查</title><rect width="720" height="770" fill="#f7f4ed"/><g font-family="Noto Serif CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="54" font-size="29" fill="#17324d" font-weight="700" text-anchor="start">图24  让决策可以被复查</text><text x="36" y="98" font-size="23" fill="#546574" font-weight="400" text-anchor="start">把事实、假设、结果和过程分别记录</text><rect x="36" y="125" width="648" height="113" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="157" font-size="24" fill="#147d82" font-weight="700" text-anchor="start">交易前</text><text x="56" y="190" font-size="23" fill="#17324d" font-weight="700" text-anchor="start">目标／期限／投入金额</text><text x="56" y="220" font-size="21" fill="#546574" font-weight="400" text-anchor="start">写下理由及什么证据会改变判断</text><line x1="360" y1="240" x2="360" y2="261" stroke="#147d82" stroke-width="3"/><rect x="36" y="264" width="648" height="113" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="296" font-size="24" fill="#147d82" font-weight="700" text-anchor="start">持有中</text><text x="56" y="329" font-size="23" fill="#17324d" font-weight="700" text-anchor="start">披露变化／现金流变化</text><text x="56" y="359" font-size="21" fill="#546574" font-weight="400" text-anchor="start">核对事实，区分价格波动与条件改变</text><line x1="360" y1="379" x2="360" y2="400" stroke="#147d82" stroke-width="3"/><rect x="36" y="403" width="648" height="113" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="435" font-size="24" fill="#147d82" font-weight="700" text-anchor="start">复盘时</text><text x="56" y="468" font-size="23" fill="#17324d" font-weight="700" text-anchor="start">净回报与合适基准</text><text x="56" y="498" font-size="21" fill="#546574" font-weight="400" text-anchor="start">入金不是收益；费用不能重复扣除</text><line x1="360" y1="518" x2="360" y2="539" stroke="#147d82" stroke-width="3"/><rect x="36" y="542" width="648" height="113" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="574" font-size="24" fill="#147d82" font-weight="700" text-anchor="start">修订后</text><text x="56" y="607" font-size="23" fill="#17324d" font-weight="700" text-anchor="start">保留、调整或退出</text><text x="56" y="637" font-size="21" fill="#546574" font-weight="400" text-anchor="start">记录依据，更新下次检查时间</text><text x="36" y="726" font-size="21" fill="#546574" font-weight="400" text-anchor="start">结果好 ≠ 每个判断都对；结果差 ≠ 每个判断都错。</text></g></svg>