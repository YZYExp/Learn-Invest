<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title"><title id="title">先给钱分配任务</title><rect width="720" height="760" fill="#f7f4ed"/><g font-family="Noto Serif CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="54" font-size="29" fill="#17324d" font-weight="700" text-anchor="start">图21  先给钱分配任务</text><text x="36" y="98" font-size="22" fill="#546574" font-weight="400" text-anchor="start">虚构林家：现金合计12万元；必要支出0.8万元/月</text><rect x="36" y="126" width="648" height="112" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="159" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">日常周转</text><text x="660" y="159" font-size="24" fill="#147d82" font-weight="700" text-anchor="end">1.6万元</text><text x="56" y="191" font-size="21" fill="#546574" font-weight="400" text-anchor="start">两个月必要支出</text><rect x="56" y="208" width="80.0" height="12" rx="4" fill="#147d82" stroke="none"/><rect x="36" y="254" width="648" height="112" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="287" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">应急储备</text><text x="660" y="287" font-size="24" fill="#147d82" font-weight="700" text-anchor="end">4.0万元</text><text x="56" y="319" font-size="21" fill="#546574" font-weight="400" text-anchor="start">收入中断与意外支出</text><rect x="56" y="336" width="200.0" height="12" rx="4" fill="#147d82" stroke="none"/><rect x="36" y="382" width="648" height="112" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="415" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">已知支出</text><text x="660" y="415" font-size="24" fill="#d99732" font-weight="700" text-anchor="end">2.0万元</text><text x="56" y="447" font-size="21" fill="#546574" font-weight="400" text-anchor="start">八个月后付款</text><rect x="56" y="464" width="100.0" height="12" rx="4" fill="#d99732" stroke="none"/><rect x="36" y="510" width="648" height="112" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="543" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">长期余额</text><text x="660" y="543" font-size="24" fill="#17324d" font-weight="700" text-anchor="end">4.4万元</text><text x="56" y="575" font-size="21" fill="#546574" font-weight="400" text-anchor="start">进一步讨论投资用途</text><rect x="56" y="592" width="220.0" height="12" rx="4" fill="#17324d" stroke="none"/><text x="36" y="680" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">1.6 ＋ 4.0 ＋ 2.0 ＋ 4.4 ＝ 12.0万元</text><text x="36" y="724" font-size="22" fill="#546574" font-weight="400" text-anchor="start">同一笔钱不重复承担两项资金任务。</text></g></svg>