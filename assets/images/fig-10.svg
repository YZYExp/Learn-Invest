<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img"><title>一个1000股买单，为什么分档成交</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#2878a0"/></marker></defs><rect width="720" height="760" fill="#fbfaf6"/><g font-family="Noto Serif CJK SC, sans-serif"><text x="36" y="52" font-size="28" fill="#17324d" text-anchor="start" font-weight="700">一个1000股买单，为什么分档成交</text><text x="36" y="87" font-size="18" fill="#52697b" text-anchor="start" font-weight="400">静态订单簿；不计费用与报价更新</text><rect x="32" y="118" width="656" height="275" rx="14" fill="#edf3f5"/><text x="58" y="155" font-size="23" fill="#17324d" text-anchor="start" font-weight="700">当前卖盘（由低价到高价）</text><rect x="53" y="169" width="613" height="48" rx="6" fill="#e1edf2"/><text x="75" y="200" font-size="24" fill="#17324d" text-anchor="start" font-weight="400">10.00元</text><text x="275" y="200" font-size="23" fill="#17324d" text-anchor="start" font-weight="400">300股</text><rect x="438" y="183" width="111.0" height="16" rx="3" fill="#7eb7c8"/><rect x="53" y="229" width="613" height="48" rx="6" fill="#e1edf2"/><text x="75" y="260" font-size="24" fill="#17324d" text-anchor="start" font-weight="400">10.05元</text><text x="275" y="260" font-size="23" fill="#17324d" text-anchor="start" font-weight="400">400股</text><rect x="438" y="243" width="148.0" height="16" rx="3" fill="#7eb7c8"/><rect x="53" y="289" width="613" height="48" rx="6" fill="#e1edf2"/><text x="75" y="320" font-size="24" fill="#17324d" text-anchor="start" font-weight="400">10.20元</text><text x="275" y="320" font-size="23" fill="#17324d" text-anchor="start" font-weight="400">500股</text><rect x="438" y="303" width="185.0" height="16" rx="3" fill="#7eb7c8"/><text x="58" y="377" font-size="19" fill="#52697b" text-anchor="start" font-weight="400">最优买价9.98元；最优卖价10.00元</text><rect x="32" y="418" width="656" height="122" rx="14" fill="#dceee8"/><text x="56" y="451" font-size="24" fill="#238b78" text-anchor="start" font-weight="700">立即买入1000股</text><text x="56" y="484" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">300×10.00＋400×10.05＋300×10.20</text><text x="56" y="518" font-size="23" fill="#238b78" text-anchor="start" font-weight="400">总价10080元  →  均价10.08元</text><rect x="32" y="560" width="656" height="116" rx="14" fill="#f4e4d7"/><text x="56" y="595" font-size="24" fill="#17324d" text-anchor="start" font-weight="700">限价10.05元，买入1000股</text><text x="56" y="631" font-size="22" fill="#17324d" text-anchor="start" font-weight="400">先成交300＋400＝700股</text><text x="56" y="660" font-size="19" fill="#17324d" text-anchor="start" font-weight="400">剩余300股等待；并非保证全部成交</text><text x="36" y="724" font-size="19" fill="#52697b" text-anchor="start" font-weight="400">市价侧重及时成交；限价约束价格，可能无法成交。</text></g></svg>