<svg xmlns="http://www.w3.org/2000/svg" width="720" height="740" viewBox="0 0 720 740" role="img" aria-labelledby="title desc"><title id="title">经济、公司与价格：三块时钟</title><desc id="desc">它们相互影响，却不保证同向、同时变化。</desc><rect width="720" height="740" fill="#f7f8f3"/><g font-family="Noto Serif CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="52" font-size="29" fill="#173c49" text-anchor="start" font-weight="bold">经济、公司与价格：三块时钟</text><text x="36" y="88" font-size="19" fill="#526a73" text-anchor="start" font-weight="normal">它们相互影响，却不保证同向、同时变化。</text><rect x="36" y="122" width="648" height="94" rx="14" fill="#e5f2ee"/><text x="56" y="159" font-size="25" fill="#173c49" text-anchor="start" font-weight="bold">经济时钟</text><text x="250" y="156" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">产出、消费、就业</text><text x="250" y="190" font-size="20" fill="#526a73" text-anchor="start" font-weight="normal">记录整体经济活动</text><rect x="36" y="232" width="648" height="94" rx="14" fill="#e5f2ee"/><text x="56" y="269" font-size="25" fill="#173c49" text-anchor="start" font-weight="bold">公司时钟</text><text x="250" y="266" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">订单、收入、成本</text><text x="250" y="300" font-size="20" fill="#526a73" text-anchor="start" font-weight="normal">记录企业经营成果</text><rect x="36" y="342" width="648" height="94" rx="14" fill="#e5f2ee"/><text x="56" y="379" font-size="25" fill="#173c49" text-anchor="start" font-weight="bold">价格时钟</text><text x="250" y="376" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">最新成交、估值</text><text x="250" y="410" font-size="20" fill="#526a73" text-anchor="start" font-weight="normal">反映交易与未来判断</text><text x="36" y="493" font-size="25" fill="#173c49" text-anchor="start" font-weight="bold">盈利增长，不保证价格上涨</text><text x="40" y="527" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">原来：每股收益1.00元 × 25倍</text><text x="675" y="527" font-size="22" fill="#127d84" text-anchor="end" font-weight="bold">价格25.00元</text><text x="40" y="590" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">后来：每股收益1.20元 × 18倍</text><text x="675" y="590" font-size="22" fill="#127d84" text-anchor="end" font-weight="bold">价格21.60元</text><text x="36" y="644" font-size="23" fill="#b85e32" text-anchor="start" font-weight="bold">盈利增长20%；价格下降13.6%。</text><line x1="36" y1="680" x2="684" y2="680" stroke="#c6d6d2" stroke-width="2"/><text x="36" y="713" font-size="18" fill="#526a73" text-anchor="start" font-weight="normal">图18 · 原创教学假设；非历史行情与收益预测</text></g></svg>