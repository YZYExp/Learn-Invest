<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc"><title id="title">业绩增长，股价为何仍会下跌</title><desc id="desc">比较实际结果，也要比较此前预期和估值。</desc><rect width="720" height="780" fill="#f7f8f3"/><g font-family="Noto Serif CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="52" font-size="29" fill="#173c49" text-anchor="start" font-weight="bold">业绩增长，股价为何仍会下跌</text><text x="36" y="88" font-size="19" fill="#526a73" text-anchor="start" font-weight="normal">比较实际结果，也要比较此前预期和估值。</text><text x="36" y="128" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">同一股数；价格 = 每股收益 × 市盈率</text><rect x="36" y="151" width="648" height="101" rx="14" fill="#e5f2ee"/><text x="54" y="180" font-size="23" fill="#173c49" text-anchor="start" font-weight="bold">基准年估价</text><text x="667" y="180" font-size="22" fill="#526a73" text-anchor="end" font-weight="normal">1.00元 × 20倍</text><rect x="54" y="198" width="395.8" height="31" rx="5" fill="#127d84"/><text x="666" y="223" font-size="26" fill="#173c49" text-anchor="end" font-weight="bold">20.00元</text><rect x="36" y="267" width="648" height="101" rx="14" fill="#e5f2ee"/><text x="54" y="296" font-size="23" fill="#173c49" text-anchor="start" font-weight="bold">原先预期</text><text x="667" y="296" font-size="22" fill="#526a73" text-anchor="end" font-weight="normal">1.20元 × 20倍</text><rect x="54" y="314" width="475.0" height="31" rx="5" fill="#127d84"/><text x="666" y="339" font-size="26" fill="#173c49" text-anchor="end" font-weight="bold">24.00元</text><rect x="36" y="383" width="648" height="101" rx="14" fill="#e5f2ee"/><text x="54" y="412" font-size="23" fill="#173c49" text-anchor="start" font-weight="bold">实际后估价A</text><text x="667" y="412" font-size="22" fill="#526a73" text-anchor="end" font-weight="normal">1.10元 × 20倍</text><rect x="54" y="430" width="435.4" height="31" rx="5" fill="#b85e32"/><text x="666" y="455" font-size="26" fill="#173c49" text-anchor="end" font-weight="bold">22.00元</text><rect x="36" y="499" width="648" height="101" rx="14" fill="#e5f2ee"/><text x="54" y="528" font-size="23" fill="#173c49" text-anchor="start" font-weight="bold">实际后估价B</text><text x="667" y="528" font-size="22" fill="#526a73" text-anchor="end" font-weight="normal">1.10元 × 18倍</text><rect x="54" y="546" width="391.9" height="31" rx="5" fill="#b85e32"/><text x="666" y="571" font-size="26" fill="#173c49" text-anchor="end" font-weight="bold">19.80元</text><text x="36" y="652" font-size="22" fill="#b85e32" text-anchor="start" font-weight="normal">从预期24元到19.80元：价格下降17.5%。</text><text x="36" y="685" font-size="21" fill="#173c49" text-anchor="start" font-weight="normal">比基准年赚得更多，也可能低于此前买入预期。</text><line x1="36" y1="720" x2="684" y2="720" stroke="#c6d6d2" stroke-width="2"/><text x="36" y="753" font-size="18" fill="#526a73" text-anchor="start" font-weight="normal">图20 · 原创教学假设；非历史行情与收益预测</text></g></svg>