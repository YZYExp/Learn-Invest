<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img"><title>股东动作：现金与股数一起看</title><rect width="720" height="780" fill="#faf8f2"/><g font-family="Noto Serif CJK SC, Noto Serif CJK SC, sans-serif"><text x="36" y="48" font-size="19" fill="#197a74" font-weight="bold">16 / 理解公司与价格</text><text x="36" y="94" font-size="30" fill="#213c45" font-weight="bold">股东动作：现金与股数一起看</text><text x="36" y="131" font-size="20" fill="#526970" font-weight="normal">公司资金流向不同，每股背后的权益也会变化</text><rect x="36" y="166" width="648" height="151" rx="16" fill="#e8f3ef"/><text x="56" y="205" font-size="25" fill="#197a74" font-weight="bold">分红｜发出现金5万元</text><text x="56" y="250" font-size="21" fill="#213c45" font-weight="normal">公司现金 −5万元；总股数仍10万股</text><text x="56" y="289" font-size="21" fill="#213c45" font-weight="normal">每股收到0.5元；理论除息价格20→19.5元</text><rect x="36" y="340" width="648" height="151" rx="16" fill="#eee9d9"/><text x="56" y="379" font-size="25" fill="#197a74" font-weight="bold">回购并注销｜花20万元买1万股</text><text x="56" y="424" font-size="21" fill="#213c45" font-weight="normal">公司现金 −20万元；股数10万→9万股</text><text x="56" y="463" font-size="21" fill="#213c45" font-weight="normal">利润仍10万元时，每股收益1→约1.1111元</text><rect x="36" y="514" width="648" height="151" rx="16" fill="#e4eef0"/><text x="56" y="553" font-size="25" fill="#197a74" font-weight="bold">增发｜20元发行2万股</text><text x="56" y="598" font-size="21" fill="#213c45" font-weight="normal">公司现金 +40万元；股数10万→12万股</text><text x="56" y="637" font-size="21" fill="#213c45" font-weight="normal">利润暂不变时，每股收益1→约0.8333元</text><text x="36" y="714" font-size="21" fill="#213c45" font-weight="normal">三种独立场景，均从10万股、每股20元起算。</text><text x="36" y="750" font-size="18" fill="#526970" font-weight="normal">忽略税费与市场变化；机械变化不能代替价值判断。</text></g></svg>