<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img"><title>成交、回转与交收：分开看三个时钟</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#2878a0"/></marker></defs><rect width="720" height="790" fill="#fbfaf6"/><g font-family="Noto Serif CJK SC, sans-serif"><text x="36" y="52" font-size="28" fill="#17324d" text-anchor="start" font-weight="700">成交、回转与交收：分开看三个时钟</text><text x="36" y="87" font-size="18" fill="#52697b" text-anchor="start" font-weight="400">普通股票示意；制度核验：2026-10-23</text><rect x="30" y="117" width="660" height="119" rx="14" fill="#e1edf2"/><text x="51" y="152" font-size="25" fill="#2878a0" text-anchor="start" font-weight="700">成交</text><text x="51" y="190" font-size="22" fill="#17324d" text-anchor="start" font-weight="400">买卖已经匹配，形成履约义务。</text><text x="51" y="220" font-size="19" fill="#52697b" text-anchor="start" font-weight="400">不自动等于“款项已交收、可转出”。</text><rect x="30" y="258" width="660" height="133" rx="14" fill="#dceee8"/><text x="51" y="295" font-size="25" fill="#238b78" text-anchor="start" font-weight="700">当日回转</text><text x="51" y="331" font-size="21" fill="#17324d" text-anchor="start" font-weight="400">港股可当日买卖；普通A股新买股份</text><text x="51" y="364" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">通常不能当天卖出，特定品种另有规则。</text><rect x="30" y="414" width="660" height="227" rx="14" fill="#edf3f5"/><text x="51" y="453" font-size="24" fill="#17324d" text-anchor="start" font-weight="700">交收周期：假设没有相关假日</text><text x="228" y="494" font-size="21" fill="#17324d" text-anchor="middle" font-weight="400">周一 T</text><text x="410" y="494" font-size="21" fill="#17324d" text-anchor="middle" font-weight="400">周二</text><text x="586" y="494" font-size="21" fill="#17324d" text-anchor="middle" font-weight="400">周三</text><text x="52" y="545" font-size="21" fill="#17324d" text-anchor="start" font-weight="400">美股多数</text><text x="52" y="575" font-size="19" fill="#52697b" text-anchor="start" font-weight="400">适用交易</text><path d="M226,550 L410,550" stroke="#2878a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="410" y="583" font-size="19" fill="#2878a0" text-anchor="middle" font-weight="400">T+1交收</text><text x="52" y="615" font-size="21" fill="#17324d" text-anchor="start" font-weight="400">港股通常</text><path d="M226,610 L586,610" stroke="#2878a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="586" y="638" font-size="19" fill="#2878a0" text-anchor="middle" font-weight="400">T+2交收</text><text x="36" y="696" font-size="19" fill="#17324d" text-anchor="start" font-weight="400">能否卖出、能否再买、能否转出银行，是不同问题。</text><text x="36" y="731" font-size="19" fill="#52697b" text-anchor="start" font-weight="400">交收按相应营业日计算；互联互通另查渠道规则。</text><text x="36" y="764" font-size="18" fill="#52697b" text-anchor="start" font-weight="400">港股T+1尚属改革计划，不按计划提前改写当前制度。</text></g></svg>