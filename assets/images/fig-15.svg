<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img"><title>把价格拆成两部分</title><rect width="720" height="780" fill="#faf8f2"/><g font-family="Noto Serif CJK SC, Noto Serif CJK SC, sans-serif"><text x="36" y="48" font-size="19" fill="#197a74" font-weight="bold">15 / 理解公司与价格</text><text x="36" y="94" font-size="30" fill="#213c45" font-weight="bold">把价格拆成两部分</text><text x="36" y="131" font-size="20" fill="#526970" font-weight="normal">每股价格 = 每股收益 × 市盈率（同口径正利润）</text><rect x="36" y="167" width="648" height="145" rx="16" fill="#e8f3ef"/><text x="58" y="205" font-size="25" fill="#197a74" font-weight="bold">起点：每股收益1元 × 市盈率20倍</text><text x="58" y="252" font-size="30" fill="#213c45" font-weight="bold">每股价格 = 20元</text><text x="58" y="288" font-size="21" fill="#526970" font-weight="normal">10万股 × 20元 = 股权市值200万元</text><text x="36" y="361" font-size="25" fill="#213c45" font-weight="bold">利润相同，市场给予的倍数不同</text><text x="50" y="415" font-size="24" fill="#213c45" font-weight="normal">12倍</text><rect x="155" y="385" width="180" height="39" rx="7" fill="#197a74"/><text x="560" y="415" font-size="25" fill="#213c45" font-weight="normal">12元</text><text x="50" y="485" font-size="24" fill="#213c45" font-weight="normal">25倍</text><rect x="155" y="455" width="375" height="39" rx="7" fill="#d89b45"/><text x="560" y="485" font-size="25" fill="#213c45" font-weight="normal">25元</text><rect x="36" y="555" width="648" height="163" rx="16" fill="#f4e8df"/><text x="57" y="594" font-size="25" fill="#ba6656" font-weight="bold">盈利增长，也可能遇到股价下跌</text><text x="57" y="635" font-size="28" fill="#213c45" font-weight="normal">1.2元 × 12倍 = 14.4元</text><text x="57" y="679" font-size="23" fill="#213c45" font-weight="normal">盈利 +20%　　价格相对20元 −28%</text><text x="36" y="752" font-size="18" fill="#526970" font-weight="normal">教学假设：倍数不代表推荐值；未来利润并不确定。</text></g></svg>