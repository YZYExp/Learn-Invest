dth="259.20000000000005" height="58" rx="0" fill="#d99732" stroke="none"/><text x="48" y="540" font-size="23" fill="white" font-weight="400" text-anchor="start">股票6.72</text><text x="436.8" y="540" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">债券4.48</text><text x="36" y="598" font-size="22" fill="#546574" font-weight="400" text-anchor="start">股票60.00%</text><text x="36" y="698" font-size="25" fill="#147d82" font-weight="700" text-anchor="start">卖股票4800元 → 买债券4800元</text><text x="36" y="738" font-size="21" fill="#546574" font-weight="400" text-anchor="start">只靠新增资金恢复比例，则需向债券加入8000元。</text></g></svg>