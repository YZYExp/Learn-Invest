<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img"><title>同一家公司，三种观察角度</title><rect width="720" height="780" fill="#faf8f2"/><g font-family="Noto Serif CJK SC, Noto Serif CJK SC, sans-serif"><text x="36" y="48" font-size="19" fill="#197a74" font-weight="bold">14 / 理解公司与价格</text><text x="36" y="94" font-size="30" fill="#213c45" font-weight="bold">同一家公司，三种观察角度</text><text x="36" y="131" font-size="20" fill="#526970" font-weight="normal">青禾面包的简化账：利润、现金与资产相互勾稽</text><rect x="36" y="165" width="648" height="145" rx="16" fill="#e8f3ef"/><text x="57" y="202" font-size="25" fill="#197a74" font-weight="bold">利润表｜全年赚多少</text><text x="57" y="245" font-size="20" fill="#213c45" font-weight="normal">收入100 − 现金性质费用85 − 折旧5</text><text x="57" y="281" font-size="22" fill="#213c45" font-weight="normal">净利润 = 10万元</text><rect x="36" y="330" width="648" height="145" rx="16" fill="#e8f3ef"/><text x="57" y="367" font-size="25" fill="#197a74" font-weight="bold">现金流量表｜钱怎么移动</text><text x="57" y="410" font-size="20" fill="#213c45" font-weight="normal">经营：10 + 5 − 应收增加3 − 存货增加4 = 8</text><text x="57" y="446" font-size="22" fill="#213c45" font-weight="normal">投资：买设备 −6；筹资：0；现金净增加 = 2</text><rect x="36" y="515" width="648" height="145" rx="16" fill="#e8f3ef"/><text x="57" y="552" font-size="25" fill="#197a74" font-weight="bold">资产负债表｜年末留下什么</text><text x="57" y="595" font-size="20" fill="#213c45" font-weight="normal">资产55 = 负债15 + 权益40</text><text x="57" y="631" font-size="22" fill="#213c45" font-weight="normal">现金：年初18 + 净增加2 = 年末20</text><text x="354" y="319" font-size="28" fill="#197a74" font-weight="normal">↓</text><text x="354" y="504" font-size="28" fill="#197a74" font-weight="normal">↓</text><text x="36" y="711" font-size="22" fill="#213c45" font-weight="normal">权益：年初30 + 净利润10 = 年末40</text><text x="36" y="748" font-size="18" fill="#526970" font-weight="normal">单位：万元；无分红、新增借款、增���及其他权益变化。</text></g></svg>