<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img"><title>发行与转手：钱最终到哪里</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#2878a0"/></marker></defs><rect width="720" height="760" fill="#fbfaf6"/><g font-family="Noto Serif CJK SC, sans-serif"><text x="36" y="52" font-size="28" fill="#17324d" text-anchor="start" font-weight="700">发行与转手：钱最终到哪里</text><text x="36" y="87" font-size="18" fill="#52697b" text-anchor="start" font-weight="400">同一家公司，两个不同的资金接收方</text><rect x="30" y="120" width="660" height="245" rx="14" fill="#edf3f5"/><text x="52" y="156" font-size="24" fill="#238b78" text-anchor="start" font-weight="700">① 公司发行新股</text><rect x="55" y="187" width="165" height="94" rx="14" fill="#dceee8"/><text x="137" y="226" font-size="23" fill="#17324d" text-anchor="middle" font-weight="400">投资者甲</text><text x="137" y="256" font-size="19" fill="#17324d" text-anchor="middle" font-weight="400">出资20万元</text><rect x="496" y="187" width="165" height="94" rx="14" fill="#dce9f3"/><text x="578" y="226" font-size="23" fill="#17324d" text-anchor="middle" font-weight="400">青禾面包</text><text x="578" y="256" font-size="19" fill="#17324d" text-anchor="middle" font-weight="400">取得20万元</text><path d="M232,209 L481,209" stroke="#2878a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="356" y="196" font-size="19" fill="#2878a0" text-anchor="middle" font-weight="400">认购资金</text><path d="M481,263 L232,263" stroke="#2878a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="356" y="295" font-size="19" fill="#2878a0" text-anchor="middle" font-weight="400">新发行2万股</text><text x="54" y="337" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">发行后：总股数由10万股变为12万股</text><rect x="30" y="388" width="660" height="251" rx="14" fill="#edf3f5"/><text x="52" y="427" font-size="24" fill="#238b78" text-anchor="start" font-weight="700">② 投资者转让已持有股份</text><rect x="55" y="461" width="165" height="94" rx="14" fill="#dceee8"/><text x="137" y="499" font-size="23" fill="#17324d" text-anchor="middle" font-weight="400">投资者乙</text><text x="137" y="530" font-size="19" fill="#17324d" text-anchor="middle" font-weight="400">买入1000股</text><rect x="496" y="461" width="165" height="94" rx="14" fill="#f4e4d7"/><text x="578" y="499" font-size="23" fill="#17324d" text-anchor="middle" font-weight="400">投资者甲</text><text x="578" y="530" font-size="19" fill="#17324d" text-anchor="middle" font-weight="400">取得1.2万元</text><path d="M232,483 L481,483" stroke="#2878a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="356" y="470" font-size="19" fill="#2878a0" text-anchor="middle" font-weight="400">交易款1.2万元</text><path d="M481,537 L232,537" stroke="#2878a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="356" y="569" font-size="19" fill="#2878a0" text-anchor="middle" font-weight="400">已发行1000股</text><text x="54" y="613" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">转手后：公司总股数仍为12万股</text><text x="36" y="690" font-size="19" fill="#52697b" text-anchor="start" font-weight="400">假设：新股每股10元，转手每股12元，忽略费用。</text><text x="36" y="722" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">普通二级市场交易款不会自动进入公司账户。</text></g></svg>