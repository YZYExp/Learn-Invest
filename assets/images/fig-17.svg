<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img" aria-labelledby="title desc"><title id="title">同一张债券，两种今天的价格</title><desc id="desc">折现率提高，固定现金流的现值降低。</desc><rect width="720" height="730" fill="#f7f8f3"/><g font-family="Noto Serif CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="52" font-size="29" fill="#173c49" text-anchor="start" font-weight="bold">同一张债券，两种今天的价格</text><text x="36" y="88" font-size="19" fill="#526a73" text-anchor="start" font-weight="normal">折现率提高，固定现金流的现值降低。</text><text x="36" y="134" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">合同现金流不变：面值1000元，年票息3%</text><rect x="36" y="160" width="204" height="118" rx="14" fill="#e5f2ee"/><text x="138" y="198" font-size="21" fill="#173c49" text-anchor="middle" font-weight="normal">第1年末</text><text x="138" y="244" font-size="31" fill="#173c49" text-anchor="middle" font-weight="bold">30元</text><rect x="258" y="160" width="204" height="118" rx="14" fill="#e5f2ee"/><text x="360" y="198" font-size="21" fill="#173c49" text-anchor="middle" font-weight="normal">第2年末</text><text x="360" y="244" font-size="31" fill="#173c49" text-anchor="middle" font-weight="bold">30元</text><rect x="480" y="160" width="204" height="118" rx="14" fill="#e5f2ee"/><text x="582" y="198" font-size="21" fill="#173c49" text-anchor="middle" font-weight="normal">第3年末</text><text x="582" y="244" font-size="31" fill="#173c49" text-anchor="middle" font-weight="bold">1030元</text><text x="36" y="322" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">今天的价格：把三笔款项分别折现后相加</text><rect x="36" y="349" width="648" height="111" rx="14" fill="#e5f2ee"/><text x="56" y="385" font-size="23" fill="#173c49" text-anchor="start" font-weight="normal">要求收益率3%</text><text x="660" y="385" font-size="29" fill="#173c49" text-anchor="end" font-weight="bold">1000.00元</text><text x="56" y="427" font-size="23" fill="#526a73" text-anchor="start" font-weight="normal">30/1.03 + 30/1.03² + 1030/1.03³</text><rect x="36" y="478" width="648" height="111" rx="14" fill="#e5f2ee"/><text x="56" y="514" font-size="23" fill="#173c49" text-anchor="start" font-weight="normal">要求收益率5%</text><text x="660" y="514" font-size="29" fill="#173c49" text-anchor="end" font-weight="bold">945.54元</text><text x="56" y="556" font-size="23" fill="#526a73" text-anchor="start" font-weight="normal">30/1.05 + 30/1.05² + 1030/1.05³</text><text x="36" y="632" font-size="20" fill="#526a73" text-anchor="start" font-weight="normal">假设：无违约、无税费、年末付息、完整剩余3年。</text><line x1="36" y1="670" x2="684" y2="670" stroke="#c6d6d2" stroke-width="2"/><text x="36" y="703" font-size="18" fill="#526a73" text-anchor="start" font-weight="normal">图17 · 原创教学假设；非历史行情与收益预测</text></g></svg>