<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">风险：资金任务怎样失灵</title><desc id="desc">价格波动只是其中一种表现</desc><rect width="720" height="650" fill="#F6F5EF"/><g font-family="Noto Serif CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif"><text x="36" y="50" font-size="28" fill="#18333B" text-anchor="start">风险：资金任务怎样失灵</text><text x="36" y="84" font-size="18" fill="#526971" text-anchor="start">价格波动只是其中一种表现</text><rect x="36" y="116" width="648" height="74" rx="12" fill="#18333B"/><text x="360" y="146" font-size="23" fill="#FFFFFF" text-anchor="middle">目标：到期有足够、可动用的购买力</text><text x="360" y="175" font-size="18" fill="#FFFFFF" text-anchor="middle">观察点放在需要用钱的那一天</text><line x1="62" y1="190" x2="62" y2="234" stroke="#187D85" stroke-width="2"/><rect x="86" y="222" width="598" height="66" rx="12" fill="#FFFFFF"/><text x="104" y="248" font-size="23" fill="#187D85" text-anchor="start">价格下跌</text><text x="104" y="275" font-size="20" fill="#526971" text-anchor="start">市场变化，变现所得不足</text><line x1="62" y1="279" x2="62" y2="323" stroke="#187D85" stroke-width="2"/><rect x="86" y="311" width="598" height="66" rx="12" fill="#FFFFFF"/><text x="104" y="337" font-size="23" fill="#187D85" text-anchor="start">合同失约</text><text x="104" y="364" font-size="20" fill="#526971" text-anchor="start">信用受损，约定付款未到</text><line x1="62" y1="368" x2="62" y2="412" stroke="#187D85" stroke-width="2"/><rect x="86" y="400" width="598" height="66" rx="12" fill="#FFFFFF"/><text x="104" y="426" font-size="23" fill="#187D85" text-anchor="start">退出困难</text><text x="104" y="453" font-size="20" fill="#526971" text-anchor="start">交易稀少或锁定期，钱取不出</text><line x1="62" y1="457" x2="62" y2="501" stroke="#187D85" stroke-width="2"/><rect x="86" y="489" width="598" height="66" rx="12" fill="#FFFFFF"/><text x="104" y="515" font-size="23" fill="#187D85" text-anchor="start">购买力变化</text><text x="104" y="542" font-size="20" fill="#526971" text-anchor="start">通胀或汇率变化，买不到原定数量</text><text x="36" y="620" font-size="19" fill="#526971" text-anchor="start">同一资产可同时暴露于多种风险；并非概率图</text></g></svg>