<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">同一笔钱，三种任务</title><desc id="desc">先按使用时间与用途分层，再选择产品</desc><rect width="720" height="650" fill="#F6F5EF"/><g font-family="Noto Serif CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif"><text x="36" y="50" font-size="28" fill="#18333B" text-anchor="start">同一笔钱，三种任务</text><text x="36" y="84" font-size="18" fill="#526971" text-anchor="start">先按使用时间与用途分层，再选择产品</text><text x="36" y="128" font-size="25" fill="#18333B" text-anchor="start">应急：3万元</text><rect x="36" y="146" width="240.0" height="30" rx="5" fill="#187D85"/><text x="36" y="208" font-size="20" fill="#526971" text-anchor="start">按每月必要开支1万元，演示3个月缓冲</text><text x="36" y="260" font-size="25" fill="#18333B" text-anchor="start">半年后支出：2万元</text><rect x="36" y="278" width="160.0" height="30" rx="5" fill="#CB8D37"/><text x="36" y="340" font-size="20" fill="#526971" text-anchor="start">确定要用的钱，先检查何时可取回</text><text x="36" y="392" font-size="25" fill="#18333B" text-anchor="start">长期规划：7万元</text><rect x="36" y="410" width="560.0" height="30" rx="5" fill="#18333B"/><text x="36" y="472" font-size="20" fill="#526971" text-anchor="start">其余资金再按目标、期限与风险安排</text><text x="36" y="590" font-size="20" fill="#526971" text-anchor="start">总额12万元｜原创假设，不是推荐比例</text></g></svg>