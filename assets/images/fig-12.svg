<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img"><title>资产跌10%，自己的钱跌多少</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#2878a0"/></marker></defs><rect width="720" height="790" fill="#fbfaf6"/><g font-family="Noto Serif CJK SC, sans-serif"><text x="36" y="52" font-size="28" fill="#17324d" text-anchor="start" font-weight="700">资产跌10%，自己的钱跌多少</text><text x="36" y="87" font-size="18" fill="#52697b" text-anchor="start" font-weight="400">两组初始自有资金都为10万元；不计成本</text><text x="36" y="135" font-size="25" fill="#238b78" text-anchor="start" font-weight="700">A 全额自有资金</text><text x="37" y="200" font-size="21" fill="#17324d" text-anchor="start" font-weight="400">买入时</text><rect x="165" y="175" width="250" height="38" rx="4" fill="#56a58d"/><text x="427" y="202" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">权益10万</text><text x="37" y="257" font-size="21" fill="#17324d" text-anchor="start" font-weight="400">下跌后</text><rect x="165" y="232" width="225" height="38" rx="4" fill="#56a58d"/><text x="402" y="259" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">权益9万</text><text x="165" y="319" font-size="23" fill="#238b78" text-anchor="start" font-weight="400">权益：10万 → 9万，亏损10%</text><rect x="30" y="346" width="660" height="303" rx="14" fill="#edf3f5"/><text x="48" y="388" font-size="25" fill="#2878a0" text-anchor="start" font-weight="700">B 自有10万＋借入10万</text><text x="45" y="450" font-size="21" fill="#17324d" text-anchor="start" font-weight="400">买入时</text><rect x="157" y="424" width="250" height="42" rx="4" fill="#56a58d"/><rect x="407" y="424" width="250" height="42" rx="4" fill="#c4cfd8"/><text x="282.0" y="452" font-size="18" fill="#10372a" text-anchor="middle" font-weight="400">权益10万</text><text x="532.0" y="452" font-size="18" fill="#17324d" text-anchor="middle" font-weight="400">债务10万</text><text x="45" y="518" font-size="21" fill="#17324d" text-anchor="start" font-weight="400">下跌后</text><rect x="157" y="492" width="200" height="42" rx="4" fill="#56a58d"/><rect x="357" y="492" width="250" height="42" rx="4" fill="#c4cfd8"/><text x="257.0" y="520" font-size="18" fill="#10372a" text-anchor="middle" font-weight="400">权益8万</text><text x="482.0" y="520" font-size="18" fill="#17324d" text-anchor="middle" font-weight="400">债务10万</text><text x="49" y="580" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">资产：20万 → 18万；债务暂按10万不变</text><text x="49" y="621" font-size="24" fill="#b95d56" text-anchor="start" font-weight="700">权益：10万 → 8万，亏损20%</text><text x="36" y="697" font-size="19" fill="#17324d" text-anchor="start" font-weight="400">权益＝资产市值－债务。借款不会随资产下跌而减少。</text><text x="36" y="733" font-size="20" fill="#17324d" text-anchor="start" font-weight="400">下跌后杠杆：18÷8＝2.25倍，高于初始2倍。</text><text x="36" y="768" font-size="18" fill="#52697b" text-anchor="start" font-weight="400">实际账户还可能产生利息、追加保证金或强制平仓。</text></g></svg>