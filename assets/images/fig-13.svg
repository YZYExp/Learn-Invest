<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img"><title>收入不等于利润</title><rect width="720" height="760" fill="#faf8f2"/><g font-family="Noto Serif CJK SC, Noto Serif CJK SC, sans-serif"><text x="36" y="48" font-size="19" fill="#197a74" font-weight="bold">13 / 理解公司与价格</text><text x="36" y="94" font-size="30" fill="#213c45" font-weight="bold">收入不等于利润</text><text x="36" y="131" font-size="20" fill="#526970" font-weight="normal">同一门生意：先看收入如何被支出分走</text><text x="36" y="192" font-size="22" fill="#213c45" font-weight="normal">收入</text><rect x="257" y="171" width="335.0" height="30" rx="6" fill="#197a74"/><text x="610" y="194" font-size="23" fill="#213c45" font-weight="bold">100</text><text x="36" y="262" font-size="22" fill="#213c45" font-weight="normal">变动支出</text><rect x="257" y="241" width="167.5" height="30" rx="6" fill="#78a59b"/><text x="610" y="264" font-size="23" fill="#213c45" font-weight="bold">50</text><text x="36" y="332" font-size="22" fill="#213c45" font-weight="normal">固定支出</text><rect x="257" y="311" width="117.25" height="30" rx="6" fill="#b5c7b9"/><text x="610" y="334" font-size="23" fill="#213c45" font-weight="bold">35</text><text x="36" y="402" font-size="22" fill="#213c45" font-weight="normal">其他费用及税收</text><rect x="257" y="381" width="16.75" height="30" rx="6" fill="#d89b45"/><text x="610" y="404" font-size="23" fill="#213c45" font-weight="bold">5</text><text x="36" y="472" font-size="22" fill="#213c45" font-weight="normal">净利润</text><rect x="257" y="451" width="33.5" height="30" rx="6" fill="#197a74"/><text x="610" y="474" font-size="23" fill="#213c45" font-weight="bold">10</text><rect x="36" y="545" width="648" height="156" rx="16" fill="#e8f3ef"/><text x="57" y="580" font-size="25" fill="#197a74" font-weight="bold">收入少10%，利润可能少50%</text><text x="57" y="620" font-size="23" fill="#213c45" font-weight="normal">原来：100 − 50 − 35 − 5 = 10</text><text x="57" y="661" font-size="23" fill="#213c45" font-weight="normal">下降后：90 − 45 − 35 − 5 = 5</text><text x="36" y="737" font-size="18" fill="#526970" font-weight="normal">单位：万元；其他支出暂固定，税费现实可能变化。</text></g></svg>