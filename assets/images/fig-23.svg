<svg xmlns="http://www.w3.org/2000/svg" width="720" height="750" viewBox="0 0 720 750" role="img" aria-labelledby="title"><title id="title">金额固定，份额变化</title><rect width="720" height="750" fill="#f7f4ed"/><g font-family="Noto Serif CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="54" font-size="29" fill="#17324d" font-weight="700" text-anchor="start">图23  金额固定，份额变化</text><text x="36" y="98" font-size="22" fill="#546574" font-weight="400" text-anchor="start">每次投入1000元；小数份额不受限制；无费用</text><rect x="36" y="124" width="648" height="238" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="161" font-size="26" fill="#17324d" font-weight="700" text-anchor="start">路径A：10 → 5 → 10元</text><text x="56" y="206" font-size="22" fill="#546574" font-weight="400" text-anchor="start">第1次：10元</text><rect x="56" y="226" width="50.0" height="25" rx="3" fill="#147d82" stroke="none"/><text x="56" y="282" font-size="23" fill="#147d82" font-weight="700" text-anchor="start">100.00份</text><text x="266" y="206" font-size="22" fill="#546574" font-weight="400" text-anchor="start">第2次：5元</text><rect x="266" y="226" width="100.0" height="25" rx="3" fill="#147d82" stroke="none"/><text x="266" y="282" font-size="23" fill="#147d82" font-weight="700" text-anchor="start">200.00份</text><text x="476" y="206" font-size="22" fill="#546574" font-weight="400" text-anchor="start">第3次：10元</text><rect x="476" y="226" width="50.0" height="25" rx="3" fill="#147d82" stroke="none"/><text x="476" y="282" font-size="23" fill="#147d82" font-weight="700" text-anchor="start">100.00份</text><text x="56" y="331" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">共400.00份；期末约4000.00元</text><rect x="36" y="388" width="648" height="238" rx="14" fill="#ffffff" stroke="none"/><text x="56" y="425" font-size="26" fill="#17324d" font-weight="700" text-anchor="start">路径B：10 → 15 → 20元</text><text x="56" y="470" font-size="22" fill="#546574" font-weight="400" text-anchor="start">第1次：10元</text><rect x="56" y="490" width="50.0" height="25" rx="3" fill="#147d82" stroke="none"/><text x="56" y="546" font-size="23" fill="#147d82" font-weight="700" text-anchor="start">100.00份</text><text x="266" y="470" font-size="22" fill="#546574" font-weight="400" text-anchor="start">第2次：15元</text><rect x="266" y="490" width="33.333333333333336" height="25" rx="3" fill="#147d82" stroke="none"/><text x="266" y="546" font-size="23" fill="#147d82" font-weight="700" text-anchor="start">66.67份</text><text x="476" y="470" font-size="22" fill="#546574" font-weight="400" text-anchor="start">第3次：20元</text><rect x="476" y="490" width="25.0" height="25" rx="3" fill="#147d82" stroke="none"/><text x="476" y="546" font-size="23" fill="#147d82" font-weight="700" text-anchor="start">50.00份</text><text x="56" y="595" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">共216.67份；期末约4333.33元</text><text x="36" y="704" font-size="22" fill="#546574" font-weight="400" text-anchor="start">定投改变投入节奏，不保证盈利或胜过一次投入。</text></g></svg>