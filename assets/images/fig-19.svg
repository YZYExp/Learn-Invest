<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="title desc"><title id="title">“净流出”不等于没有买方</title><desc id="desc">先问统计口径，再解释资金方向。</desc><rect width="720" height="770" fill="#f7f8f3"/><g font-family="Noto Serif CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="52" font-size="29" fill="#173c49" text-anchor="start" font-weight="bold">“净流出”不等于没有买方</text><text x="36" y="88" font-size="19" fill="#526a73" text-anchor="start" font-weight="normal">先问统计口径，再解释资金方向。</text><rect x="36" y="122" width="648" height="183" rx="14" fill="#e5f2ee"/><text x="360" y="161" font-size="25" fill="#173c49" text-anchor="middle" font-weight="bold">实际交换：三笔成交合计</text><text x="63" y="208" font-size="23" fill="#173c49" text-anchor="start" font-weight="normal">买方群体</text><text x="552" y="208" font-size="23" fill="#173c49" text-anchor="start" font-weight="normal">卖方群体</text><line x1="192" y1="200" x2="524" y2="200" stroke="#127d84" stroke-width="3"/><text x="360" y="192" font-size="22" fill="#127d84" text-anchor="middle" font-weight="normal">支付2970元 →</text><line x1="192" y1="265" x2="524" y2="265" stroke="#b85e32" stroke-width="3"/><text x="360" y="254" font-size="22" fill="#b85e32" text-anchor="middle" font-weight="normal">← 转移300股</text><text x="36" y="353" font-size="23" fill="#173c49" text-anchor="start" font-weight="bold">同一批成交，按主动方向标签再分类</text><text x="36" y="415" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">主动买入</text><rect x="180" y="390" width="169.90" height="38" fill="#127d84" rx="5"/><text x="670" y="417" font-size="24" fill="#173c49" text-anchor="end" font-weight="bold">980元</text><text x="36" y="488" font-size="22" fill="#173c49" text-anchor="start" font-weight="normal">主动卖出</text><rect x="180" y="463" width="345.00" height="38" fill="#b85e32" rx="5"/><text x="670" y="490" font-size="24" fill="#173c49" text-anchor="end" font-weight="bold">1990元</text><rect x="36" y="541" width="648" height="93" rx="14" fill="#e5f2ee"/><text x="360" y="576" font-size="25" fill="#173c49" text-anchor="middle" font-weight="bold">标签差额：980 − 1990 = −1010元</text><text x="360" y="612" font-size="21" fill="#173c49" text-anchor="middle" font-weight="normal">买卖双方金额相等；主动方向金额可以不等。</text><text x="36" y="673" font-size="20" fill="#526a73" text-anchor="start" font-weight="normal">自定义分类示例；不识别机构身份；忽略费用。</text><line x1="36" y1="710" x2="684" y2="710" stroke="#c6d6d2" stroke-width="2"/><text x="36" y="743" font-size="18" fill="#526a73" text-anchor="start" font-weight="normal">图19 · 原创教学假设；非历史行情与收益预测</text></g></svg>